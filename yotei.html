<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 12px 12px 40px; font-family: -apple-system, sans-serif; background: #f4f5f7; color: #222; }
  select, input, textarea { width: 100%; font-size: 17px; padding: 10px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-family: inherit; }
  button { font-family: inherit; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 11px; font-size: 16px; font-weight: 600; border-radius: 10px; border: 1px solid #2980b9; background: #fff; color: #2980b9; }
  .tabs button.on { background: #2980b9; color: #fff; }
  .nav { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .nav button { width: 48px; padding: 9px 0; font-size: 18px; border-radius: 10px; border: 1px solid #999; background: #fff; }
  .nav .mid { flex: 1; text-align: center; font-weight: 600; font-size: 16px; }
  .nav .mid input { text-align: center; font-weight: 600; }
  table { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  th { font-size: 13px; color: #666; font-weight: 600; }
  td.d { font-size: 14px; font-weight: 600; text-align: center; background: #fff; border-radius: 8px; padding: 8px 2px; border: 1px solid #ddd; }
  td.d small { display: block; font-size: 11px; color: #888; font-weight: 400; }
  td.d.today { border-color: #2980b9; color: #2980b9; }
  .sun { color: #c0392b; } .sat { color: #2471a3; }
  td.s { text-align: center; border-radius: 8px; padding: 10px 2px; font-size: 17px; font-weight: 700; color: #fff; }
  td.s.free { background: #27ae60; } td.s.last { background: #f1c40f; color: #5c4b00; } td.s.full { background: #b8bcc2; } td.s.over { background: #c0392b; }
  td.s small { display: block; font-size: 11px; font-weight: 400; opacity: .9; }
  td.none { background: transparent; }
  .legend { display: flex; gap: 10px; justify-content: center; font-size: 12px; color: #666; margin: 6px 0; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 3px; vertical-align: -1px; }
  .card { background: #fff; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #ddd; }
  .card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card b { font-size: 17px; }
  .card small { display: block; color: #555; margin-top: 4px; font-size: 14px; }
  .st { font-size: 13px; padding: 3px 9px; border-radius: 10px; background: #e8eef7; color: #333; white-space: nowrap; }
  .btns { display: flex; gap: 6px; margin-top: 10px; }
  .btns > * { flex: 1; padding: 10px 0; font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid #2980b9; background: #fff; color: #2980b9; text-align: center; text-decoration: none; }
  .btns .map { border-color: #27ae60; color: #27ae60; }
  .add { width: 100%; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 12px; border: 2px dashed #27ae60; background: #fff; color: #27ae60; margin-top: 4px; }
  .sheet { display: none; position: fixed; inset: 0; background: #f4f5f7; z-index: 10; overflow-y: auto; padding: 16px; }
  .sheet.open { display: block; }
  #sale { z-index: 12; }
  .sheet h2 { margin: 0 0 12px; font-size: 20px; }
  .sheet label { display: block; font-size: 14px; color: #555; margin: 12px 0 4px; }
  .note { font-size: 13px; color: #888; margin-top: 4px; }
  .actions { display: flex; gap: 10px; margin: 20px 0 16px; }
  .actions button { flex: 1; padding: 14px; font-size: 17px; font-weight: 600; border-radius: 12px; border: 0; }
  .ok { background: #27ae60; color: #fff; }
  .cancel { background: #ddd; }
  .del { width: 100%; padding: 12px; font-size: 16px; border-radius: 10px; border: 1px solid #c0392b; background: #fff; color: #c0392b; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .checks label { display: flex !important; align-items: center; gap: 8px; margin: 0 !important; padding: 10px; background: #fff; border: 1px solid #ccc; border-radius: 10px; font-size: 16px !important; color: #222 !important; }
  .checks input { width: 22px; height: 22px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button.r { min-height: 64px; font-size: 17px; font-weight: 600; border: 0; border-radius: 14px; color: #fff; }
  button.r.cur { outline: 4px solid #222; }
  #msg { text-align: center; min-height: 20px; margin: 8px 0; font-size: 14px; color: #666; white-space: pre-line; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,.6); z-index: 30;
             align-items: center; justify-content: center; flex-direction: column; font-size: 16px; font-weight: 600; }
  body.busy #overlay { display: flex; }
  .spinner { width: 44px; height: 44px; border: 5px solid #ccc; border-top-color: #2980b9; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hide { display: none; }
  .req { color: #c0392b; }
  .sec { margin: 22px 0 0; padding-top: 10px; border-top: 2px solid #dde3ea; font-weight: 700; font-size: 16px; }
  .choice { display: flex; gap: 8px; }
  .choice button { flex: 1; padding: 10px; font-size: 17px; border-radius: 10px; border: 1px solid #ccc; background: #fff; }
  .choice button.on { background: #2980b9; border-color: #2980b9; color: #fff; font-weight: 600; }
  .card details { margin-top: 6px; font-size: 14px; }
  .card summary { color: #2980b9; font-weight: 600; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 0; }
  .card dt { color: #777; } .card dd { margin: 0; }
  table.mon { border-spacing: 2px; }
  .mon th { font-size: 12px; }
  .mon td { vertical-align: top; height: 76px; background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 2px 1px 2px 2px; font-size: 10px; overflow: hidden; }
  .mon td.out { opacity: .35; }
  .mon td.today { border: 2px solid #2980b9; }
  .mon .n { font-weight: 700; font-size: 12px; }
  .mon .e { white-space: nowrap; overflow: hidden; text-overflow: clip; line-height: 1.35; letter-spacing: -.3px; }
  .mon .e b { font-weight: 600; color: #555; }
  .mon .more { color: #888; }
  .kinds { display: flex; gap: 6px; margin-bottom: 8px; }
  .kinds button { flex: 1; padding: 8px; font-size: 14px; font-weight: 600; border-radius: 20px; border: 1px solid #8e44ad; background: #fff; color: #8e44ad; }
  .kinds button.on { background: #8e44ad; color: #fff; }
  table.sh { border-spacing: 2px; }
  .sh td.s { padding: 9px 0; font-size: 14px; }
  td.s.mine { background: #8e44ad; } td.s.block { background: #e1e4e8; color: #9aa0a6; }
  .st.shoho { background: #8e44ad; color: #fff; }
  .mon .e.sh b { color: #8e44ad; }
  .shd td { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 9px 6px; font-size: 14px; }
  .shd td.c { text-align: center; font-weight: 700; color: #fff; }
  .shd td.c.free { background: #27ae60; } .shd td.c.full { background: #b8bcc2; }
  .shd td.x { color: #888; font-size: 13px; }
  .subh { margin: 16px 0 6px; font-weight: 700; color: #8e44ad; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<style>
  /* 住宅設備アプリ共通のデザイン。色は Lien Fort（lienfort.co.jp）に合わせる。各画面の style より後に読むので上書きになる */
  :root { --ink: #18202e; --blue: #2a56a8; --sub: #4b5567; --line: #e3e8f0; --bg: #f6f8fb; --pale: #eef2f9;
          --en: Oswald, "Arial Narrow", sans-serif; }
  body { background: var(--bg) !important; color: var(--ink) !important; padding: 0 14px 40px !important;
         font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif !important; }
  .lf-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 -14px 14px; padding: 10px 14px;
            background: var(--ink); color: #fff; }
  .lf-back { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding-bottom: 3px;
             border: 1px solid rgba(255,255,255,.3); border-radius: 8px; color: #fff; text-decoration: none; font-size: 24px; }
  .lf-t small { display: block; font-family: var(--en); font-size: 10px; letter-spacing: .3em; color: #9fb4dd; }
  .lf-t b { font-size: 17px; letter-spacing: .05em; }

  select, input, textarea { border: 1px solid var(--line) !important; color: var(--ink); }
  select:focus, input:focus, textarea:focus { outline: 2px solid rgba(42,86,168,.3); border-color: var(--blue) !important; }
  h2 { letter-spacing: .03em; }

  /* 今日の数字 */
  .summary { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .summary div { font-size: 12px; color: var(--sub); }
  .summary b { font-family: var(--en); font-weight: 500; font-size: 30px !important; color: var(--ink); }

  /* ボタン。結果ボタンの色（成約＝緑など）は見分けやすさのため各画面のまま */
  button.r { border-radius: 12px !important; box-shadow: 0 2px 0 rgba(0,0,0,.12); letter-spacing: .03em; }
  .undo, .listbtn, .nav button, .btns > *, .cancel { background: #fff !important; border: 1px solid var(--line) !important; color: var(--ink) !important; }
  .listbtn, .btns > *, .btns .map { color: var(--blue) !important; }
  .ok { background: var(--blue) !important; color: #fff !important; }
  .add { border-color: var(--blue) !important; color: var(--blue) !important; background: #fff !important; }
  .tabs button { border: 1px solid var(--line) !important; background: #fff !important; color: var(--sub) !important; }
  .tabs button.on { background: var(--ink) !important; border-color: var(--ink) !important; color: #fff !important; }
  .choice button.on { background: var(--ink) !important; border-color: var(--ink) !important; }

  /* カード・表 */
  .card, td.d { border: 1px solid var(--line) !important; box-shadow: 0 1px 2px rgba(24,32,46,.05); }
  .card summary, .req { color: var(--blue) !important; }
  td.d.today, .mon td.today { border-color: var(--blue) !important; color: var(--blue); }
  td.s.free { background: var(--blue) !important; }
  .legend span:first-child i { background: var(--blue) !important; }
  .sec { border-top-color: var(--line) !important; color: var(--ink); }

  /* 重なる画面（入力・一覧など）と読み込み中 */
  .sheet, #sale, #list, #pick { background: var(--bg) !important; }
  #pickList button { border-color: var(--line) !important; }
  .spinner { border-top-color: var(--blue) !important; }
</style>

<body>
  <header class="lf-bar"><a href="index.html" class="lf-back" aria-label="メニュー">‹</a><div class="lf-t"><small>LIEN FORT</small><b>商談予定</b></div></header>
  <div class="tabs"><button id="tabMonth">月</button><button id="tabGrid" class="on">枠表</button><button id="tabList">予定一覧</button></div>

  <div id="monthView" class="hide">
    <div class="nav"><button id="prevM">◀</button><div class="mid" id="monthLabel"></div><button id="nextM">▶</button></div>
    <table class="mon"><tbody id="monthBody"></tbody></table>
    <div class="note" style="text-align:center">日を押すと、その日の予定一覧</div>
  </div>

  <div id="gridView">
    <div class="kinds"><button id="kShodan" class="on">商談</button><button id="kShoho">催事 初訪</button></div>
    <div class="nav"><button id="prevW">◀</button><div class="mid" id="weekLabel"></div><button id="nextW">▶</button></div>
    <table><thead id="gridHead"></thead><tbody id="gridBody"></tbody></table>
    <div class="legend" id="legShodan"><span><i style="background:#27ae60"></i>空きあり</span><span><i style="background:#f1c40f"></i>残り1</span>
      <span><i style="background:#b8bcc2"></i>満枠</span><span><i style="background:#c0392b"></i>入れすぎ</span></div>
    <div class="legend hide" id="legShoho"><span>1日9件まで・30分刻み</span><span>× は商談が満枠の前後3時間</span></div>
    <div class="note" style="text-align:center">マスを押すと予定の確認・追加、日付を押すと休み・時間帯の変更</div>
  </div>

  <div id="listView" class="hide">
    <div class="nav"><button id="prevD">◀</button><div class="mid"><input type="date" id="listDay"></div><button id="nextD">▶</button></div>
    <div id="listBox"></div>
  </div>
  <div id="msg"></div>

  <!-- 枠の中身 -->
  <div class="sheet" id="slot">
    <h2 id="slotTitle"></h2>
    <div id="slotBox"></div>
    <div class="actions"><button class="cancel" id="closeSlot">閉じる</button></div>
  </div>

  <!-- 予定の入力 -->
  <div class="sheet" id="form">
    <h2 id="formTitle"></h2>
    <div class="grid2">
      <div><label>日付</label><input type="date" id="fDate"></div>
      <div><label id="fTimeL">時間（枠）</label><select id="fTime"></select></div>
    </div>
    <div id="fStartBox"><label>開始時間（枠からずらすとき）</label><select id="fStart"></select></div>
    <label>お客様名 <span class="req">*</span></label><input id="fCustomer" placeholder="例：山田太郎様">
    <label>住所 <span class="req nr">*</span></label><input id="fAddress" placeholder="例：福岡市中央区天神1-1-1">
    <label>GoogleマップのURL <span class="req nr">*</span></label><input id="fMap" inputmode="url" placeholder="https://maps.app.goo.gl/…">
    <label>商材（複数選べます）</label><div class="checks" id="fProduct"></div>
    <label>担当アポインター</label><select id="fAp"></select>
    <input id="fApOther" class="hide" style="margin-top:6px" placeholder="アポインターの名前">
    <label>担当クローザー（あとからでも入れられます）</label><select id="fCl"></select>
    <div id="fDetail"></div>
    <label>備考</label><textarea id="fMemo" rows="3"></textarea>
    <div class="note"><span class="req">*</span> は新しく入れるときに必須</div>
    <div class="actions"><button class="cancel" id="cancelForm">やめる</button><button class="ok" id="saveForm">保存</button></div>
    <button class="del hide" id="delForm">この予定を消す</button>
  </div>

  <!-- 結果 -->
  <div class="sheet" id="res">
    <h2 id="resTitle"></h2>
    <div class="note" id="resNote"></div>
    <div class="grid2" id="resBtns" style="margin-top:12px"></div>
    <div class="actions"><button class="cancel" id="closeRes">閉じる</button></div>
    <button class="del hide" id="clearRes">結果を消す</button>
  </div>

  <!-- 成約（クローザー入力と同じ項目） -->
  <div class="sheet" id="sale">
    <h2>成約の入力</h2>
    <label>契約日</label><input type="date" id="sDate">
    <label>お客様名</label><input id="sCustomer">
    <label>契約場所</label><select id="sPlace"></select>
    <label>チーム</label><select id="sTeam"></select>
    <label>アポインター</label><select id="sAp"></select>
    <input id="sApOther" class="hide" style="margin-top:6px" placeholder="アポインターの名前">
    <label>販売価格（円）</label><input id="sPrice" type="number" inputmode="numeric" placeholder="例：2750000">
    <label>決済方法</label><select id="sPayment"></select>
    <label>販売商品（複数選べます）</label><div class="checks" id="sProduct"></div>
    <label>備考</label><input id="sNote">
    <div class="actions"><button class="cancel" id="cancelSale">やめる</button><button class="ok" id="sendSale">成約を記録</button></div>
  </div>

  <!-- 日の設定 -->
  <div class="sheet" id="day">
    <h2 id="dayTitle"></h2>
    <label>活動できるクローザー（休みの人は外す）</label>
    <div class="checks" id="dayClosers"></div>
    <label>この日の時間帯</label>
    <input id="dayTimes" placeholder="10:00,14:00,18:00">
    <div class="note">カンマで区切って入れます。いつもは 10:00,14:00,18:00</div>
    <div class="actions"><button class="cancel" id="closeDay">閉じる</button><button class="ok" id="saveTimes">時間帯を保存</button></div>
  </div>

  <div id="overlay"><div class="spinner"></div><span id="overlayText">保存中…</span></div>

<script>
  const COLORS = { '成約':'#27ae60', '失注':'#c0392b', '対象外':'#555', '片面':'#e67e22', '不在':'#8a8f98', 'フロントアウト':'#d9534f' };
  const OTHER = 'その他（手入力）';
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
  const label = s => { const d = parse(s); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; };
  const wdClass = s => ({ 0: 'sun', 6: 'sat' })[parse(s).getDay()] || '';

  let cfg = null, data = { days: {}, appts: [], shoho: [] }, view = 'grid', kind = '', formKind = '', start = '', listDay = '', month = '', editing = null, current = null;

  // 月カレンダーは、月初の週の日曜〜月末の週の土曜
  function monthRange() {
    const d = parse(month), last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return [addDays(month, -d.getDay()), addDays(ymd(last), 6 - last.getDay())];
  }
  function range() { return view === 'grid' ? [start, addDays(start, 6)] : view === 'month' ? monthRange() : [listDay, listDay]; }
  function dayOf(s) { return data.days[s] || { times: ['10:00', '14:00', '18:00'], off: [] }; }
  function cap(s) { return cfg.closers.filter(n => !dayOf(s).off.includes(n)).length; }
  function inSlot(s, t) { return data.appts.filter(a => a.date === s && a.time === t); }
  const mins = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));
  // 初訪の時間 t の前後3時間（ちょうども含む）に満枠の商談があれば、その時間（Code.gs の yShohoBlock_ と同じ）
  function blockedBy(s, t) {
    const c = cap(s);
    return dayOf(s).times.find(x => { const n = inSlot(s, x).length; return Math.abs(mins(x) - mins(t)) <= cfg.shohoGap && n > 0 && n >= c; }) || '';
  }
  const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  const startOf = a => a.start || a.time;
  const byStart = (a, b) => startOf(a).localeCompare(startOf(b));
  function timeText(a) { return a.start ? a.start + '（' + Number(a.time.slice(0, 2)) + '時枠）' : a.time; }
  function inShohoDay(s) { return data.shoho.filter(a => a.date === s).sort(byStart); }
  // 初訪を入れられない時間帯（満枠の商談の前後3時間）を「11:00〜17:00」のように
  function blockedText(s) {
    const out = [];
    let run = null;
    cfg.shohoTimes.forEach(t => {
      if (blockedBy(s, t)) { if (run) run[1] = t; else out.push(run = [t, t]); } else run = null;
    });
    return out.map(r => r[0] === r[1] ? r[0] : r[0] + '〜' + r[1]).join('、');
  }
  function mapUrl(a) { return a.map || (a.address ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a.address) : ''); }

  function setBusy(on, text) {
    if (text) $('overlayText').textContent = text;
    document.body.classList.toggle('busy', on);
  }

  // サーバーを呼んで、返ってきた枠と予定で画面を描き直す
  function call(fn, args, text, after) {
    setBusy(true, text || '保存中…');
    google.script.run
      .withSuccessHandler(r => {
        setBusy(false);
        if (r && r.data) { data = r.data; if (r.errors && r.errors.length) alert(r.errors.join('\n')); } else if (r) data = r;
        render();
        if (after) after();
      })
      .withFailureHandler(e => { setBusy(false); alert(e.message); })[fn](...args, ...range());
  }
  function load(quiet) {
    if (!quiet) setBusy(true, '読み込み中…');
    google.script.run
      .withSuccessHandler(r => { setBusy(false); data = r; render(); })
      .withFailureHandler(e => { setBusy(false); $('msg').textContent = 'エラー: ' + e.message; })
      .yData(...range());
  }

  function render() {
    renderGrid(); renderList(); renderMonth();
    if ($('slot').classList.contains('open')) renderSlot();
    if ($('day').classList.contains('open')) renderDay();
  }

  // ===== 枠表 =====
  function renderGrid() {
    $('weekLabel').textContent = label(start) + ' 〜 ' + label(addDays(start, 6));
    ['Shodan', 'Shoho'].forEach(k => { $('k' + k).classList.toggle('on', (kind === 'shoho') === (k === 'Shoho')); $('leg' + k).classList.toggle('hide', (kind === 'shoho') !== (k === 'Shoho')); });
    $('gridHead').parentNode.classList.toggle('sh', kind === 'shoho');
    if (kind === 'shoho') return renderShohoGrid();
    const days = [...Array(7)].map((_, i) => addDays(start, i));
    const times = [...new Set(days.flatMap(s => dayOf(s).times))].sort();
    $('gridHead').innerHTML = '<tr><th style="width:23%"></th>' + times.map(t => '<th>' + t + '</th>').join('') + '</tr>';
    const body = $('gridBody');
    body.innerHTML = '';
    days.forEach(s => {
      const tr = document.createElement('tr'), c = cap(s);
      const td = document.createElement('td');
      td.className = 'd ' + wdClass(s) + (s === cfg.today ? ' today' : '');
      td.innerHTML = label(s) + '<small>CL ' + c + '人</small>';
      td.onclick = () => openDay(s);
      tr.appendChild(td);
      times.forEach(t => {
        const cell = document.createElement('td');
        if (!dayOf(s).times.includes(t)) { cell.className = 'none'; tr.appendChild(cell); return; }
        const n = inSlot(s, t).length, left = c - n;
        cell.className = 's ' + (left < 0 ? 'over' : left === 0 ? 'full' : left === 1 ? 'last' : 'free');
        cell.innerHTML = n + '/' + c + '<small>' + (left > 0 ? '空き' + left : left === 0 ? '満枠' : '超過') + '</small>';
        cell.onclick = () => openSlot(s, t);
        tr.appendChild(cell);
      });
      body.appendChild(tr);
    });
  }

  // 初訪の枠表：日ごとに件数（9件まで）と、入れられない時間
  function renderShohoGrid() {
    const days = [...Array(7)].map((_, i) => addDays(start, i));
    $('gridHead').innerHTML = '<tr><th style="width:26%"></th><th style="width:22%">初訪</th><th>× 入れられない時間</th></tr>';
    const body = $('gridBody');
    body.innerHTML = '';
    days.forEach(s => {
      const tr = document.createElement('tr'), n = inShohoDay(s).length, b = blockedText(s);
      tr.className = 'shd';
      tr.innerHTML = '<td class="d ' + wdClass(s) + (s === cfg.today ? ' today' : '') + '">' + label(s) + '</td>' +
        '<td class="c ' + (n >= cfg.shohoMax ? 'full' : 'free') + '">' + n + '/' + cfg.shohoMax + '</td><td class="x"></td>';
      tr.querySelector('.x').textContent = b || 'なし';
      tr.onclick = () => openSlot(s, '', 'shoho');
      body.appendChild(tr);
    });
  }

  // ===== 月カレンダー =====
  function renderMonth() {
    const d0 = parse(month), [from, to] = monthRange();
    $('monthLabel').textContent = d0.getFullYear() + '年' + (d0.getMonth() + 1) + '月';
    const body = $('monthBody');
    body.innerHTML = '<tr>' + WD.map((w, i) => '<th class="' + ({ 0: 'sun', 6: 'sat' }[i] || '') + '">' + w + '</th>').join('') + '</tr>';
    let tr;
    for (let s = from; s <= to; s = addDays(s, 1)) {
      if (parse(s).getDay() === 0) { tr = document.createElement('tr'); body.appendChild(tr); }
      const td = document.createElement('td'), list = data.appts.concat(data.shoho).filter(a => a.date === s).sort(byStart);
      td.className = (parse(s).getMonth() !== d0.getMonth() ? 'out' : '') + (s === cfg.today ? ' today' : '');
      td.innerHTML = '<div class="n ' + wdClass(s) + '">' + parse(s).getDate() + '</div>';
      const vis = list.length > 3 ? list.slice(0, 2) : list;
      vis.forEach(a => {
        const e = document.createElement('div');
        e.className = 'e' + (a.kind === 'shoho' ? ' sh' : '');
        e.innerHTML = '<b></b>';
        e.querySelector('b').textContent = startOf(a).replace(/^0?(\d+):00$/, '$1') + (a.kind === 'shoho' ? '初' : '');
        e.append(String(a.customer).replace(/\s*様$/, '')); // 狭いので「様」は省く
        if (a.result) e.style.color = COLORS[a.result]; // 結果が入ったら結果の色
        td.appendChild(e);
      });
      if (list.length > vis.length) td.insertAdjacentHTML('beforeend', '<div class="e more">他' + (list.length - vis.length) + '件</div>');
      td.onclick = () => { listDay = s; show('list'); };
      tr.appendChild(td);
    }
  }

  // ===== 予定一覧・カード =====
  function card(a, withDate) {
    const d = document.createElement('div');
    d.className = 'card';
    d.innerHTML = '<div class="top"><b></b><span class="st"></span></div><small class="ad"></small><small class="who"></small><small class="memo"></small>' +
      '<div class="btns"><a class="map" target="_blank">地図</a><button class="rb">結果</button><button class="eb">編集</button></div>';
    d.querySelector('b').textContent = (withDate ? label(a.date) + ' ' : '') + timeText(a) + '　' + a.customer;
    const st = d.querySelector('.st');
    st.textContent = a.kind === 'shoho' ? '催事 初訪' : a.result || '結果まだ';
    if (a.kind === 'shoho') { st.classList.add('shoho'); d.querySelector('.rb').remove(); }
    else if (a.result) { st.style.background = COLORS[a.result]; st.style.color = '#fff'; }
    d.querySelector('.ad').textContent = a.address || '住所なし';
    d.querySelector('.who').textContent = (a.product || '商材未定') + ' ／ AP ' + (a.ap || '-') + ' ／ CL ' + (a.cl || '未定');
    d.querySelector('.memo').textContent = a.memo || '';
    const items = cfg.fields.filter(f => a.detail && a.detail[f.key]);
    if (items.length) {
      const det = document.createElement('details'), dl = document.createElement('dl');
      det.innerHTML = '<summary>AP詳細</summary>';
      items.forEach(f => { const t = document.createElement('dt'), v = document.createElement('dd'); t.textContent = f.label.replace('↪︎ ', ''); v.textContent = a.detail[f.key]; dl.append(t, v); });
      det.appendChild(dl);
      d.querySelector('.memo').after(det);
    }
    const m = d.querySelector('.map'), u = mapUrl(a);
    if (u) m.href = u; else { m.removeAttribute('target'); m.style.opacity = .4; m.onclick = e => { e.preventDefault(); alert('住所かマップURLを入れてください'); }; }
    if (a.kind !== 'shoho') d.querySelector('.rb').onclick = () => openRes(a);
    d.querySelector('.eb').onclick = () => openForm(a);
    return d;
  }

  function renderList() {
    $('listDay').value = listDay;
    const box = $('listBox'), list = data.appts.filter(a => a.date === listDay).sort(byStart);
    box.innerHTML = '';
    const c = cap(listDay);
    const head = document.createElement('div');
    head.className = 'note';
    head.style.margin = '0 0 8px';
    head.textContent = '予定 ' + list.length + '件 ／ 枠 ' + dayOf(listDay).times.length * c + '（CL ' + c + '人 × ' + dayOf(listDay).times.join('・') + '）';
    box.appendChild(head);
    if (!list.length) box.insertAdjacentHTML('beforeend', '<p style="text-align:center;color:#888">予定はありません</p>');
    list.forEach(a => box.appendChild(card(a)));
    const add = document.createElement('button');
    add.className = 'add'; add.textContent = '＋ この日に予定を入れる';
    add.onclick = () => openForm(null, listDay, freeTime(listDay));
    box.appendChild(add);
    const sh = inShohoDay(listDay), free = cfg.shohoTimes.filter(t => !blockedBy(listDay, t)), b = blockedText(listDay);
    box.insertAdjacentHTML('beforeend', '<div class="subh">催事 初訪（' + sh.length + '/' + cfg.shohoMax + '件）</div>');
    if (b) box.insertAdjacentHTML('beforeend', '<div class="note" style="margin:0 0 8px">× ' + b + ' は商談が満枠なので入れられません</div>');
    sh.forEach(a => box.appendChild(card(a)));
    if (free.length && sh.length < cfg.shohoMax) {
      const b = document.createElement('button');
      b.className = 'add'; b.style.borderColor = b.style.color = '#8e44ad'; b.textContent = '＋ この日に初訪を入れる';
      b.onclick = () => openForm(null, listDay, free[0], 'shoho');
      box.appendChild(b);
    }
  }
  function freeTime(s) { return dayOf(s).times.find(t => inSlot(s, t).length < cap(s)) || dayOf(s).times[0]; }

  // ===== 枠の中身 =====
  function openSlot(s, t, k) { current = { date: s, time: t, kind: k || '' }; renderSlot(); $('slot').classList.add('open'); }
  function renderSlot() {
    if (current.kind === 'shoho') return renderShohoSlot();
    const { date, time } = current, list = inSlot(date, time), c = cap(date);
    $('slotTitle').textContent = label(date) + ' ' + time + '（' + list.length + '/' + c + '）';
    const box = $('slotBox');
    box.innerHTML = '';
    list.forEach(a => box.appendChild(card(a)));
    if (list.length < c) {
      const add = document.createElement('button');
      add.className = 'add'; add.textContent = '＋ 予定を入れる（空き ' + (c - list.length) + '）';
      add.onclick = () => openForm(null, date, time);
      box.appendChild(add);
    } else box.insertAdjacentHTML('beforeend', '<p style="text-align:center;color:#888">この枠は埋まっています</p>');
  }

  function renderShohoSlot() {
    const { date } = current, list = inShohoDay(date), b = blockedText(date), free = cfg.shohoTimes.filter(t => !blockedBy(date, t));
    $('slotTitle').textContent = label(date) + ' 催事 初訪（' + list.length + '/' + cfg.shohoMax + '）';
    const box = $('slotBox');
    box.innerHTML = '';
    if (b) box.insertAdjacentHTML('beforeend', '<div class="note" style="margin:0 0 8px">× ' + b + ' は商談が満枠なので入れられません</div>');
    list.forEach(a => box.appendChild(card(a)));
    if (list.length >= cfg.shohoMax) { box.insertAdjacentHTML('beforeend', '<p style="text-align:center;color:#888">この日の初訪は埋まっています</p>'); return; }
    if (!free.length) return;
    const time = free[0];
    const add = document.createElement('button');
    add.className = 'add'; add.style.borderColor = add.style.color = '#8e44ad'; add.textContent = '＋ 初訪を入れる';
    add.onclick = () => openForm(null, date, time, 'shoho');
    box.appendChild(add);
  }

  // ===== 予定の入力 =====
  function checks(id, list, on) {
    $(id).innerHTML = '';
    const sel = String(on || '').split(',').map(s => s.trim());
    list.forEach(v => {
      const l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.value = v; c.checked = sel.includes(v);
      l.append(c, v); $(id).appendChild(l);
    });
  }
  const checked = id => [...document.querySelectorAll('#' + id + ' input:checked')].map(c => c.value).join(', ');
  function setAp(sel, other, v) {
    const known = !v || cfg.appointers.includes(v);
    $(sel).value = known ? (v || '') : OTHER;
    $(other).classList.toggle('hide', known);
    $(other).value = known ? '' : v;
  }
  const getAp = (sel, other) => $(sel).value === OTHER ? $(other).value.trim() : $(sel).value;

  function fillTimes() {
    const s = $('fDate').value, keep = $('fTime').value;
    $('fTime').innerHTML = '';
    if (formKind === 'shoho') cfg.shohoTimes.forEach(t => {
      const b = blockedBy(s, t);
      const o = new Option(t + (b ? '（× ' + b + ' 商談満枠）' : ''), t);
      o.disabled = !!b && !(editing && editing.date === s && editing.time === t);
      $('fTime').add(o);
    });
    else dayOf(s).times.forEach(t => $('fTime').add(new Option(t + '（' + inSlot(s, t).filter(a => !editing || a.id !== editing.id).length + '/' + cap(s) + '）', t)));
    if (keep) $('fTime').value = keep;
    const off = dayOf(s).off, cl = $('fCl').value;
    $('fCl').innerHTML = '';
    $('fCl').add(new Option('未定', ''));
    cfg.closers.filter(n => !off.includes(n) || n === cl).forEach(n => $('fCl').add(new Option(n + (off.includes(n) ? '（休み）' : ''), n)));
    $('fCl').value = cl;
  }

  // 開始時間：枠の前後1時間、30分刻み
  function fillStart(v) {
    const t = $('fTime').value;
    $('fStart').innerHTML = '';
    if (!t) return;
    for (let m = mins(t) - 60; m <= mins(t) + 60; m += 30) $('fStart').add(new Option(hm(m) + (m === mins(t) ? '（枠どおり）' : ''), hm(m)));
    $('fStart').value = v && [...$('fStart').options].some(o => o.value === v) ? v : t;
  }

  // ===== AP詳細（項目は Code.gs の Y_FIELDS） =====
  const shown = (f, d) => !f.showIf || f.showIf.slice(1).includes(d[f.showIf[0]]);
  function getDetail() {
    const d = {};
    cfg.fields.forEach(f => {
      const w = document.querySelector('#fDetail [data-key="' + f.key + '"]');
      d[f.key] = f.type === 'choice' ? (w.querySelector('.on') || {}).textContent || '' : w.querySelector('input').value.trim();
    });
    cfg.fields.forEach(f => { if (!shown(f, d)) d[f.key] = ''; });
    return d;
  }
  function showDetail() {
    const d = getDetail();
    cfg.fields.forEach(f => document.querySelector('#fDetail [data-key="' + f.key + '"]').classList.toggle('hide', !shown(f, d)));
  }
  function renderDetail(a) {
    const box = $('fDetail'), v = (a && a.detail) || {};
    box.innerHTML = '';
    cfg.fields.forEach(f => {
      if (f.head) { const h = document.createElement('div'); h.className = 'sec'; h.textContent = f.head; box.appendChild(h); }
      const w = document.createElement('div'), l = document.createElement('label');
      w.dataset.key = f.key;
      l.textContent = f.label + ' ';
      if (f.req && !a) l.insertAdjacentHTML('beforeend', '<span class="req">*</span>');
      w.appendChild(l);
      if (f.type === 'choice') {
        const c = document.createElement('div');
        c.className = 'choice';
        f.options.forEach(o => {
          const b = document.createElement('button');
          b.type = 'button'; b.textContent = o; b.className = v[f.key] === o ? 'on' : '';
          b.onclick = () => { const on = !b.classList.contains('on'); [...c.children].forEach(x => x.classList.remove('on')); b.classList.toggle('on', on); showDetail(); };
          c.appendChild(b);
        });
        w.appendChild(c);
      } else {
        const i = document.createElement('input');
        i.type = f.type === 'date' ? 'date' : 'text';
        if (f.type === 'number') i.inputMode = 'numeric';
        if (f.type === 'tel') { i.type = 'tel'; i.inputMode = 'tel'; }
        i.placeholder = f.placeholder || '';
        i.value = v[f.key] || (!a && f.key === 'apDate' ? cfg.today : '');
        w.appendChild(i);
      }
      box.appendChild(w);
    });
    showDetail();
  }

  function openForm(a, date, time, k) {
    editing = a;
    formKind = a ? a.kind : k || '';
    $('formTitle').textContent = formKind === 'shoho' ? (a ? '初訪を直す' : '催事 初訪を入れる') : a ? '予定を直す' : '予定を入れる';
    $('fDate').value = a ? a.date : date;
    $('fCl').innerHTML = ''; $('fCl').add(new Option('', a ? a.cl : '')); $('fCl').value = a ? a.cl : '';
    $('fTime').innerHTML = '';
    fillTimes();
    $('fTime').value = a ? a.time : time;
    $('fTimeL').textContent = formKind === 'shoho' ? '時間' : '時間（枠）';
    $('fStartBox').classList.toggle('hide', formKind === 'shoho');
    fillStart(a && a.start);
    $('fCustomer').value = a ? a.customer : '';
    $('fAddress').value = a ? a.address : '';
    $('fMap').value = a ? a.map : '';
    $('fMemo').value = a ? a.memo : '';
    checks('fProduct', cfg.options.products, a && a.product);
    setAp('fAp', 'fApOther', a ? a.ap : '');
    renderDetail(a);
    document.querySelectorAll('#form .nr').forEach(x => x.classList.toggle('hide', !!a));
    $('delForm').classList.toggle('hide', !a);
    $('form').classList.add('open');
  }

  function saveForm() {
    const a = { id: editing ? editing.id : '', date: $('fDate').value, time: $('fTime').value, customer: $('fCustomer').value.trim(),
      address: $('fAddress').value.trim(), map: $('fMap').value.trim(), product: checked('fProduct'), ap: getAp('fAp', 'fApOther'),
      cl: $('fCl').value, memo: $('fMemo').value.trim(), detail: getDetail(), kind: formKind, start: formKind === 'shoho' ? '' : $('fStart').value };
    if (!a.date || !a.time || !a.customer) { alert('日付・時間・お客様名を入れてください'); return; }
    if (!editing) { // 必須は新しく入れるときだけ
      const missing = (a.address ? [] : ['住所']).concat(a.map ? [] : ['マップURL'],
        cfg.fields.filter(f => f.req && shown(f, a.detail) && !a.detail[f.key]).map(f => f.label.replace('↪︎ ', '')));
      if (missing.length) { alert('入れてください：\n' + missing.join('、')); return; }
    }
    if (a.map && !/^https?:\/\//.test(a.map)) { alert('マップURLは https:// から入れてください'); return; }
    // 別の週・日に入れたら、その日が見えるようにする
    if (view === 'grid' && (a.date < start || a.date > addDays(start, 6))) start = a.date;
    if (view === 'list') listDay = a.date;
    call('ySave', [a], '保存中…', () => { $('form').classList.remove('open'); $('msg').textContent = '保存しました：' + (a.kind === 'shoho' ? '初訪 ' : '') + label(a.date) + ' ' + (a.start || a.time) + ' ' + a.customer; });
  }
  function delForm() {
    if (!confirm(editing.customer + ' の予定を消しますか？' + (editing.result ? '\n（入っている結果「' + editing.result + '」も消えます）' : ''))) return;
    call('yDelete', [editing.id], '消しています…', () => $('form').classList.remove('open'));
  }

  // ===== 結果 =====
  function openRes(a) {
    editing = a;
    $('resTitle').textContent = timeText(a) + '　' + a.customer;
    $('resNote').textContent = a.cl ? '担当 ' + a.cl + '（クローザー入力の数字にも入ります）' : '先に「編集」で担当クローザーを入れてください';
    $('resBtns').innerHTML = '';
    cfg.results.forEach(r => {
      const b = document.createElement('button');
      b.className = 'r' + (a.result === r ? ' cur' : ''); b.style.background = COLORS[r] || '#333'; b.textContent = r;
      b.disabled = !a.cl || a.result === '成約';
      if (b.disabled) b.style.opacity = a.result === r ? 1 : .35;
      b.onclick = () => r === '成約' ? openSale(a) : setResult(r, null);
      $('resBtns').appendChild(b);
    });
    $('clearRes').classList.toggle('hide', !a.result || a.result === '成約');
    $('res').classList.add('open');
  }
  function setResult(r, sale) {
    if (!sale && editing.result && !confirm('結果を「' + editing.result + '」から「' + r + '」に直しますか？')) return;
    call('yResult', [editing.id, r, sale], '記録中…', () => {
      $('res').classList.remove('open'); $('sale').classList.remove('open');
      $('msg').textContent = '記録しました：' + editing.customer + ' ' + r;
    });
  }
  function clearRes() {
    if (!confirm('結果「' + editing.result + '」を消しますか？')) return;
    call('yClearResult', [editing.id], '消しています…', () => $('res').classList.remove('open'));
  }

  function openSale(a) {
    $('sDate').value = a.date; $('sCustomer').value = a.customer;
    $('sPlace').selectedIndex = 0; $('sTeam').selectedIndex = 0; $('sPayment').selectedIndex = 0;
    $('sPrice').value = ''; $('sNote').value = '';
    setAp('sAp', 'sApOther', a.ap);
    checks('sProduct', cfg.options.products, a.product);
    $('sale').classList.add('open');
  }
  function sendSale() {
    const sale = { date: $('sDate').value, customer: $('sCustomer').value.trim(), place: $('sPlace').value, team: $('sTeam').value,
      appointer: getAp('sAp', 'sApOther'), price: $('sPrice').value, payment: $('sPayment').value, product: checked('sProduct'), note: $('sNote').value.trim() };
    if (!sale.date || !sale.customer || !sale.appointer || !(Number(sale.price) > 0) || !sale.product) { alert('契約日・お客様名・アポインター・販売価格・販売商品を入れてください'); return; }
    if (Number(sale.price) >= 10000000 && !confirm('販売価格が ' + Number(sale.price).toLocaleString() + '円 とかなり大きいですが、合っていますか？')) return;
    if (!confirm(sale.customer + '\n' + Number(sale.price).toLocaleString() + '円\nこの内容で記録しますか？')) return;
    setResult('成約', sale);
  }

  // ===== 日の設定 =====
  function openDay(s) { current = { date: s }; renderDay(); $('dayTimes').value = dayOf(s).times.join(','); $('day').classList.add('open'); }
  function renderDay() {
    const s = current.date, off = dayOf(s).off;
    $('dayTitle').textContent = label(s) + ' の設定';
    $('dayClosers').innerHTML = '';
    cfg.closers.forEach(n => {
      const l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.checked = !off.includes(n);
      c.onchange = () => call('ySetOff', [s, n, !c.checked], '保存中…');
      l.append(c, n); $('dayClosers').appendChild(l);
    });
  }
  function saveTimes() {
    call('ySetTimes', [current.date, $('dayTimes').value], '保存中…', () => { $('dayTimes').value = dayOf(current.date).times.join(','); $('msg').textContent = '時間帯を保存しました'; });
  }

  // ===== 切り替え =====
  function show(v) {
    view = v;
    ['grid', 'list', 'month'].forEach(x => {
      $('tab' + x[0].toUpperCase() + x.slice(1)).classList.toggle('on', v === x);
      $(x + 'View').classList.toggle('hide', v !== x);
    });
    try { localStorage.setItem('yoteiView', v); } catch (e) {}
    load();
  }

  google.script.run.withSuccessHandler(c => {
    cfg = c;
    start = listDay = cfg.today;
    month = cfg.today.slice(0, 8) + '01';
    [['fAp', cfg.appointers], ['sAp', cfg.appointers]].forEach(([id, l]) => { $(id).add(new Option('選択', '')); l.concat([OTHER]).forEach(v => $(id).add(new Option(v, v))); });
    cfg.options.places.forEach(v => $('sPlace').add(new Option(v, v)));
    cfg.options.teams.forEach(v => $('sTeam').add(new Option(v, v)));
    cfg.options.payments.forEach(v => $('sPayment').add(new Option(v, v)));
    let v = 'grid';
    try { v = localStorage.getItem('yoteiView') || 'grid'; kind = localStorage.getItem('yoteiKind') || ''; } catch (e) {}
    show(v);
  }).withFailureHandler(e => { $('msg').textContent = 'エラー: ' + e.message; }).yConfig();

  $('tabMonth').onclick = () => show('month');
  $('tabGrid').onclick = () => show('grid');
  const setKind = k => { kind = k; try { localStorage.setItem('yoteiKind', k); } catch (e) {} renderGrid(); };
  $('kShodan').onclick = () => setKind('');
  $('kShoho').onclick = () => setKind('shoho');
  $('tabList').onclick = () => show('list');
  $('prevM').onclick = () => { const d = parse(month); month = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); load(); };
  $('nextM').onclick = () => { const d = parse(month); month = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1)); load(); };
  $('prevW').onclick = () => { start = addDays(start, -7); load(); };
  $('nextW').onclick = () => { start = addDays(start, 7); load(); };
  $('prevD').onclick = () => { listDay = addDays(listDay, -1); load(); };
  $('nextD').onclick = () => { listDay = addDays(listDay, 1); load(); };
  $('listDay').onchange = () => { if ($('listDay').value) { listDay = $('listDay').value; load(); } };
  $('fDate').onchange = () => { fillTimes(); fillStart($('fStart').value); };
  $('fTime').onchange = () => fillStart();
  $('fAp').onchange = () => $('fApOther').classList.toggle('hide', $('fAp').value !== OTHER);
  $('sAp').onchange = () => $('sApOther').classList.toggle('hide', $('sAp').value !== OTHER);
  $('closeSlot').onclick = () => $('slot').classList.remove('open');
  $('cancelForm').onclick = () => $('form').classList.remove('open');
  $('saveForm').onclick = saveForm;
  $('delForm').onclick = delForm;
  $('closeRes').onclick = () => $('res').classList.remove('open');
  $('clearRes').onclick = clearRes;
  $('cancelSale').onclick = () => $('sale').classList.remove('open');
  $('sendSale').onclick = sendSale;
  $('closeDay').onclick = () => $('day').classList.remove('open');
  $('saveTimes').onclick = saveTimes;
  // ほかの人が入れた予定も見えるように、1分ごとに読み直す（入力中は読み直さない）
  setInterval(() => {
    if (!cfg || document.hidden || document.body.classList.contains('busy') || $('form').classList.contains('open') || $('sale').classList.contains('open')) return;
    load(true);
  }, 60000);
</script>
</body>
</html>
