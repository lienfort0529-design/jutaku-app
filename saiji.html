<!DOCTYPE html>

<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; padding: 12px 14px 40px; font-family: -apple-system, sans-serif; background: #f4f5f7; color: #222; }
  select, input, textarea { font-size: 16px; padding: 9px 10px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-family: inherit; width: 100%; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 10px 6px; font-size: 15px; font-weight: 600; border-radius: 10px; border: 1px solid #ccc; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-bottom: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 14px; padding: 12px 14px; cursor: pointer; }
  .card .t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .card .t b { font-size: 16px; } .card .t span { font-size: 12px; white-space: nowrap; }
  .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; margin-top: 8px; }
  .kv div { display: flex; flex-direction: column; } .kv small { font-size: 11px; } .kv b { font-size: 15px; font-family: var(--num, sans-serif); }
  .chip { font-size: 12px; padding: 2px 9px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
  .meta { font-size: 13px; margin-top: 4px; }
  .note { font-size: 13px; margin: 6px 0; }
  #msg { text-align: center; font-size: 14px; min-height: 20px; margin: 6px 0; }
  .sheet { display: none; position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: 16px 16px 40px; }
  .sheet.open { display: block; }
  .sheet .in { max-width: 640px; margin: 0 auto; }
  .sheet h3 { margin: 4px 0 2px; font-size: 18px; }
  .sheet label { display: block; font-size: 13px; margin: 12px 0 4px; }
  .ro { padding: 9px 2px; font-size: 15px; }
  .acts { display: flex; gap: 10px; margin-top: 18px; position: sticky; bottom: 0; padding: 10px 0; background: var(--bg, #f4f5f7); }
  .acts button { flex: 1; padding: 13px; font-size: 16px; font-weight: 600; border-radius: 12px; border: 0; }
  .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 10px; }
  .hide { display: none !important; }
  #overlay { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; flex-direction: column; font-weight: 600; }
  body.busy #overlay { display: flex; }
  .spinner { width: 44px; height: 44px; border: 5px solid #ccc; border-top-color: #2a56a8; border-radius: 50%; animation: spin .8s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Oswald:wght@400;500&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<script>
  // 明るい・暗い：端末の設定に合わせる。右上のボタンで切り替えると、その端末に覚える（lfTheme）
  (function () { try { var t = localStorage.getItem('lfTheme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();
</script>
<style>
  /* 住宅設備アプリ共通のデザイン（2026-11-18 作り直し：明るい・暗い、パソコンは左にメニュー）。
     色は Lien Fort（lienfort.co.jp）の紺と青。各画面の style より後に読むので上書きになる */
  :root { --ink: #18202e; --blue: #2a56a8; --btn: #2a56a8; --sub: #5b6577; --line: #e2e7ef; --bg: #f3f5f9; --pale: #eef2f9;
          --surface: #fff; --surface2: #f6f8fb; --track: #e9edf3; --bar: #18202e; --chip: #18202e; --chipInk: #fff;
          --veil: rgba(243,245,249,.72); --shadow: 0 1px 2px rgba(24,32,46,.06), 0 8px 24px rgba(24,32,46,.05);
          --pend: #fff3cd; --pendInk: #7a5b00; --goodBg: #eafaf0; --badBg: #fdecea;
          --en: Oswald, "Arial Narrow", sans-serif; --num: Inter, "Hiragino Sans", sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #eef2f8; --blue: #7fa2e8; --sub: #9aa6b8; --line: #263042; --bg: #0d121b; --pale: #1c2433;
          --surface: #161d29; --surface2: #1c2433; --track: #263042; --bar: #0a0f17; --chip: #eef2f8; --chipInk: #0d121b;
          --veil: rgba(13,18,27,.72); --shadow: none; --pend: #3a3216; --pendInk: #f0d58a; --goodBg: #12301f; --badBg: #3a1a1a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ink: #eef2f8; --blue: #7fa2e8; --sub: #9aa6b8; --line: #263042; --bg: #0d121b; --pale: #1c2433;
          --surface: #161d29; --surface2: #1c2433; --track: #263042; --bar: #0a0f17; --chip: #eef2f8; --chipInk: #0d121b;
          --veil: rgba(13,18,27,.72); --shadow: none; --pend: #3a3216; --pendInk: #f0d58a; --goodBg: #12301f; --badBg: #3a1a1a; color-scheme: dark; }

  body { background: var(--bg) !important; color: var(--ink) !important; padding: 0 14px 40px !important;
         font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif !important; }

  /* 上の帯 */
  .lf-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 -14px 14px; padding: 12px 14px;
            background: var(--bar); color: #fff; }
  .lf-back { flex: none; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; padding-bottom: 3px;
             border: 1px solid rgba(255,255,255,.18); border-radius: 10px; color: #fff; text-decoration: none; font-size: 24px; }
  .lf-t small { display: block; font-family: var(--en); font-size: 10px !important; letter-spacing: .3em; color: #8fa6cf !important; }
  .lf-t b { font-size: 17px; letter-spacing: .05em; color: #fff; }
  .lf-theme { flex: none; margin-left: auto; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
              border: 1px solid rgba(255,255,255,.18); border-radius: 10px; background: rgba(255,255,255,.06); color: #fff; padding: 0; cursor: pointer; }
  .lf-theme svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  .lf-bar .who ~ .lf-theme, .lf-bar .lf-theme ~ .who { margin-left: 8px; }

  /* 入力欄 */
  select, input, textarea { background: var(--surface) !important; color: var(--ink) !important; border: 1px solid var(--line) !important; }
  select:focus, input:focus, textarea:focus { outline: 2px solid rgba(42,86,168,.35); border-color: var(--blue) !important; }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--btn); }
  h2, h3, .card h3 { letter-spacing: .03em; color: var(--ink) !important; }
  label, .note, .sub, small, #msg, .legend, .count, .calc, .coord, .state, .card dt, .gcard p { color: var(--sub) !important; }
  td.s small, .shd td.c small, button.r small, .tiles a.app.main small { color: rgba(255,255,255,.85) !important; } td.s.last small { color: #5c4b00 !important; }

  /* 面（カード・表・パネル） */
  .card, .summary, .summary > div, .tbl, .gcard, .sheet .in, #close, .visit, .panel, .find, .fab, .showBtn,
  td.d, .mon td, .shd td:not(.c), .checks label, #sale .checks label, .sheet .kinds label, .names button, #pickList button {
    background: var(--surface) !important; border-color: var(--line) !important; color: var(--ink); }
  .card, .tbl, .summary > div, .summary, .gcard, .visit { border: 1px solid var(--line) !important; border-radius: 16px !important; box-shadow: var(--shadow) !important; }
  .card summary, .req { color: var(--blue) !important; }
  .summary div { font-size: 12px; color: var(--sub); }
  .summary b, .big, .rk .v, .v, .gy td b { font-family: var(--num) !important; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .summary b { font-weight: 800; font-size: 28px !important; color: var(--ink); }
  .big { font-weight: 800 !important; color: var(--ink) !important; }
  .bar, .left .bar { background: var(--track) !important; }
  .bar i, .left .bar i { background: var(--btn) !important; } .bar i.ok { background: #27ae60 !important; }
  td.d.today, .mon td.today { border-color: var(--blue) !important; color: var(--blue); }
  td.s.free { background: var(--btn) !important; }
  td.s.block { background: var(--pale) !important; }
  .legend span:first-child i { background: var(--btn) !important; }
  .sec { border-top-color: var(--line) !important; color: var(--ink); }
  .st { background: var(--pale) !important; color: var(--ink) !important; }
  .st.shoho { background: #8e44ad !important; color: #fff !important; }
  .st.x { background: var(--badBg) !important; color: #e06b5f !important; }
  #pending { background: var(--pend) !important; color: var(--pendInk) !important; }
  .checks label, #sale .checks label, .sheet .kinds label { color: var(--ink) !important; }

  /* 表（KPI） */
  table { color: var(--ink); }
  th { background: var(--surface2) !important; color: var(--sub) !important; border-color: var(--line) !important; }
  td { border-color: var(--line) !important; }
  .tbl td:first-child { background: var(--surface) !important; }
  .tbl th:first-child, tr.total td { background: var(--surface2) !important; }
  td.good { background: var(--goodBg) !important; } td.bad { background: var(--badBg) !important; }

  /* ボタン。結果ボタンの色（成約＝緑など）は見分けやすさのため各画面のまま */
  button { font-family: inherit; }
  button.r { border-radius: 14px !important; box-shadow: 0 2px 0 rgba(0,0,0,.14); letter-spacing: .03em; }
  .undo, .listbtn, .nav button, .btns > *, .cancel, .seg button, .gyreset, .admin button, .opts button, .two button, .links button,
  .sides button, .close-btn, .choice button, .kinds button, .pc button, #goalEdit, .del, .add {
    background: var(--surface) !important; border: 1px solid var(--line) !important; color: var(--ink) !important; }
  .listbtn, .btns > *, .btns .map, .links button, .two button, #goalEdit, .close-btn { color: var(--blue) !important; }
  .del { color: #e06b5f !important; border-color: rgba(224,107,95,.5) !important; }
  .add { border: 2px dashed var(--blue) !important; color: var(--blue) !important; }
  .ok, .acts .ok, .gcard .go, #close .ok { background: var(--btn) !important; color: #fff !important; }
  .tabs { gap: 6px !important; }
  .tabs button, .seg button { border-radius: 999px !important; border: 1px solid var(--line) !important; background: var(--surface) !important; color: var(--sub) !important; font-weight: 600; }
  .tabs button.on, .seg button.on, .opts button.on, .choice button.on, .sides button.on, .showBtn.on {
    background: var(--chip) !important; border-color: var(--chip) !important; color: var(--chipInk) !important; }
  .kinds button.on { background: #8e44ad !important; border-color: #8e44ad !important; color: #fff !important; }
  #clockBtn { background: var(--pale) !important; color: var(--ink) !important; }
  #clockBtn.on { background: var(--badBg) !important; color: #e06b5f !important; }
  #placeBtn { background: var(--surface) !important; }
  #findList button { color: var(--ink) !important; border-top-color: var(--line) !important; }
  .fab, .fab * { color: var(--blue) !important; } #layerBtn, #findBtn, .showBtn { color: var(--ink) !important; }
  #areaChip { background: var(--surface) !important; color: var(--ink) !important; } #areaChip button { background: var(--pale) !important; color: var(--ink) !important; }

  /* ランキング：1〜3位は丸い数字（金・銀・銅） */
  .rk .n { font-family: var(--num); }
  .rk.m1 .n, .rk.m2 .n, .rk.m3 .n { width: 26px; height: 26px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center;
                                    font-size: 13px; font-weight: 800; }
  .rk.m1 .n { background: #e9c46a; color: #18202e !important; }
  .rk.m2 .n { background: #cfd5de; color: #18202e !important; }
  .rk.m3 .n { background: #dcae86; color: #18202e !important; }
  /* 目立たせるカード（チーム売上など） */
  .card.feature { background: #18202e !important; border-color: #18202e !important; color: #fff; }
  :root[data-theme="dark"] .card.feature { background: #1d2a44 !important; border-color: #2c3d5f !important; }
  .card.feature h3, .card.feature .big { color: #fff !important; }
  .card.feature .sub, .card.feature h3 small { color: #b8c4d8 !important; }
  .card.feature .bar { background: rgba(255,255,255,.14) !important; } .card.feature .bar i { background: #5b8def !important; }

  /* 重なる画面（入力・一覧など）と読み込み中 */
  .sheet, #sale, #list, #pick { background: var(--bg) !important; }
  #pickList button { border-color: var(--line) !important; }
  #overlay { background: var(--veil) !important; color: var(--ink); }
  #goalBox { background: rgba(0,0,0,.55) !important; }
  .spinner { border-color: var(--track) !important; border-top-color: var(--btn) !important; }

  /* パソコン：左にメニュー（#lfSide は下のスクリプトで作る） */
  #lfSide { display: none; }
  @media (min-width: 1024px) {
    body.lf-side { padding-left: 264px !important; padding-right: 32px !important; }
    body.lf-side .lf-bar { margin: 0 -32px 20px; padding-left: 32px; padding-right: 32px; }
    body.lf-side .lf-back { display: none; }
    body.lf-side > .hero { margin-left: -32px !important; margin-right: -32px !important; padding-left: 40px !important; }
    #lfSide { display: flex; position: fixed; left: 0; top: 0; bottom: 0; width: 232px; z-index: 40; flex-direction: column; gap: 22px;
              padding: 26px 14px; box-sizing: border-box; overflow-y: auto; background: #111824; color: #eef2f8; }
    #lfSide .lg { display: block; padding: 0 10px; text-decoration: none; color: #eef2f8; }
    #lfSide .lg small { display: block; font-family: var(--en); font-size: 11px; letter-spacing: .35em; color: #7fa2e8; }
    #lfSide .lg b { font-family: "Shippori Mincho B1", serif; font-size: 22px; letter-spacing: .12em; }
    #lfSide nav { display: flex; flex-direction: column; gap: 2px; }
    #lfSide nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; color: #b8c4d8; text-decoration: none; font-size: 14px; }
    #lfSide nav a:hover { background: #1a2333; color: #fff; }
    #lfSide nav a.on { background: #2a56a8; color: #fff; font-weight: 700; }
    #lfSide nav a span { font-family: var(--en); font-size: 9px; letter-spacing: .2em; color: #6f82a6; width: 58px; flex: none; }
    #lfSide nav a.on span { color: #c9d8f7; }
  }
</style>
<script>
  // 右上の明るい・暗いボタンと、パソコンの左メニュー
  document.addEventListener('DOMContentLoaded', function () {
    var root = document.documentElement;
    var dark = function () { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; };
    var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    var host = document.querySelector('.lf-bar') || document.querySelector('.hero');
    if (host) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'lf-theme';
      var paint = function () { b.innerHTML = dark() ? SUN : MOON; b.setAttribute('aria-label', dark() ? '明るい表示にする' : '暗い表示にする'); };
      b.onclick = function () { var t = dark() ? 'light' : 'dark'; root.setAttribute('data-theme', t); try { localStorage.setItem('lfTheme', t); } catch (e) {} paint(); };
      paint();
      if (host.classList.contains('hero')) { b.style.position = 'absolute'; b.style.top = '18px'; b.style.right = '16px'; b.style.zIndex = '2'; host.appendChild(b); }
      else host.insertBefore(b, host.querySelector('.who'));
    }
    // 地図の画面は全面を地図に使うので左メニューを出さない
    if (document.getElementById('map')) return;
    var gh = /github\.io$/.test(location.hostname);
    var a0 = document.querySelector('a.lf-back, a[href*="?page="]');
    var base = a0 ? a0.href.split('?')[0] : '';
    var MAP = 'map.html';
    var PAGES = [['yotei', '商談予定', 'SCHEDULE'], ['closer', 'クローザー入力', 'CLOSER'], ['tataki', '叩きカウンター', 'COUNTER'], ['ap', '催事のお客様登録', 'EVENT'],
                 ['saiji', '催事', 'REPORT'], ['sales', '売上', 'SALES'],
                 ['kpi', 'KPI・ランキング', 'KPI'], ['input', '入力', 'INPUT'], ['member', 'メンバー', 'MEMBER'], ['map', '営業マップ', 'MAP']];
    var href = function (k) { return k === 'map' ? (gh ? 'map.html' : MAP) : gh ? (k === 'menu' ? 'index.html' : k + '.html') : base + (k === 'menu' ? '' : '?page=' + k); };
    var title = (document.querySelector('.lf-t b') || {}).textContent || '';
    var file = location.pathname.split('/').pop();
    var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    var side = document.createElement('aside');
    side.id = 'lfSide';
    side.innerHTML = '<a class="lg" target="_top" href="' + esc(href('menu')) + '"><small>LIEN FORT</small><b>住宅設備</b></a><nav>' + PAGES.map(function (p) {
      var on = gh ? file === p[0] + '.html' : title.replace('催事 お客様登録', '催事のお客様登録') === p[1];
      return '<a target="_top" class="' + (on ? 'on' : '') + '" href="' + esc(href(p[0])) + '"><span>' + p[2] + '</span>' + p[1] + '</a>';
    }).join('') + '</nav>';
    document.body.appendChild(side);
    document.body.classList.add('lf-side');
  });
</script>

<script>
  // 催事日報と催事顧客管理を見る・直す（全員）。数式のマスは直せない（シートの自動計算のまま）
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} };
  const WD = '日月火水木金土';
  const dayText = s => { const d = new Date(s + 'T00:00'); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; };
  const ST_COLOR = { 'アポ獲得': '#2a56a8', '図面回収完了': '#5b8def', '商談前': '#8e44ad', '現調・見積': '#e67e22', '成約': '#27ae60', '工事完了': '#1e8449', '連系完了': '#145a32', '検討・保留': '#8a93a3', '失注': '#c0392b' };
  let D = null, view = 'nippo', editing = null, nMonthSel = null;

  function setBusy(on, t) { document.body.classList.toggle('busy', on); if (t) $('overlay').lastChild.textContent = t; }
  function load() {
    try { D = JSON.parse(store('saijiCache') || 'null'); } catch (e) {}
    if (D) { render(); $('msg').textContent = '最新を読み込み中…'; } else setBusy(true, '読み込み中…');
    google.script.run.withSuccessHandler(got).withFailureHandler(e => { setBusy(false); $('msg').textContent = 'エラー: ' + e.message; }).saijiData();
  }
  function got(r) {
    setBusy(false); D = r; $('msg').textContent = '';
    store('saijiCache', JSON.stringify(r));
    render();
  }
  function render() {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
    $('nippoBox').classList.toggle('hide', view !== 'nippo'); $('custBox').classList.toggle('hide', view !== 'cust');
    $('dlNames').innerHTML = D.names.map(n => '<option value="' + esc(n) + '">').join('');
    $('dlVenues').innerHTML = D.venues.map(n => '<option value="' + esc(n) + '">').join('');
    $('dlProducts').innerHTML = D.products.map(n => '<option value="' + esc(n) + '">').join('');
    if (view === 'nippo') renderNippo(); else renderCust();
  }
  function fillSelect(el, list, first) {
    const cur = el.value;
    el.innerHTML = '<option value="">' + first + '</option>' + list.map(x => '<option>' + esc(x) + '</option>').join('');
    el.value = list.includes(cur) ? cur : '';
  }

  // ===== 日報 =====
  function renderNippo() {
    const months = [...new Set(D.nippo.map(r => r.date.slice(0, 7)))].sort().reverse();
    $('nMonth').innerHTML = '<option value="">すべての月</option>' + months.map(m => '<option value="' + m + '">' + Number(m.slice(0, 4)) + '年' + Number(m.slice(5)) + '月</option>').join('');
    $('nMonth').value = nMonthSel !== null ? nMonthSel : (months.includes(D.today.slice(0, 7)) ? D.today.slice(0, 7) : months[0] || '');
    fillSelect($('nVenue'), [...new Set(D.nippo.map(r => r.venue))].sort(), 'すべての会場');
    const m = $('nMonth').value, v = $('nVenue').value;
    const list = D.nippo.filter(r => (!m || r.date.startsWith(m)) && (!v || r.venue === v)).sort((a, b) => b.date.localeCompare(a.date) || a.venue.localeCompare(b.venue));
    $('nCount').textContent = list.length + '件（押すと配布数などを直せます。灰色の数字はシートの自動計算）';
    $('nList').innerHTML = '';
    list.forEach(r => {
      const c = document.createElement('div');
      c.className = 'card';
      c.innerHTML = '<div class="t"><b>' + esc(dayText(r.date) + ' ' + r.venue) + '</b><span>' + esc(r.d[D.nhead.indexOf('アポ獲得数')] ? 'アポ ' + r.d[D.nhead.indexOf('アポ獲得数')] : '') + '</span></div><div class="kv">' +
        D.nhead.slice(2).map((h, j) => h ? '<div><small>' + esc(h) + '</small><b style="' + (D.nedit.includes(j + 4) ? '' : 'opacity:.7') + '">' + esc(r.d[j + 2] || '-') + '</b></div>' : '').join('') + '</div>';
      c.onclick = () => openNippo(r);
      $('nList').appendChild(c);
    });
  }
  function openNippo(r) {
    editing = { kind: 'nippo', r: r };
    $('eTitle').textContent = dayText(r.date) + ' ' + r.venue;
    $('eSub').textContent = '催事日報。自動計算の数字（失注・着座・アポ数・成約率など）は直せません';
    $('eForm').innerHTML = '<div class="two">' + D.nedit.map(c => '<div><label>' + esc(D.nhead[c - 2] || c) + '</label><input type="number" inputmode="numeric" min="0" data-c="' + c + '" value="' + esc(String(r.d[c - 2] || '').replace(/,/g, '')) + '"></div>').join('') + '</div>';
    $('edit').classList.add('open');
  }

  // ===== お客様 =====
  const CI = { no: 0, date: 1, venue: 2, customer: 3, age: 4, tel: 5, area: 6, cc: 7, qp: 8, ap: 9, cl: 10, status: 11, next: 12, survey: 13, price: 18 };
  function renderCust() {
    fillSelect($('cStatus'), D.statuses, 'すべてのステータス');
    fillSelect($('cWho'), D.names, 'すべての担当');
    const q = $('cq').value.trim(), s = $('cStatus').value, w = $('cWho').value;
    const list = D.cust.filter(c => (!s || c.v[CI.status] === s) && (!w || [CI.cc, CI.qp, CI.ap, CI.cl].some(i => c.v[i] === w)) &&
      (!q || [CI.customer, CI.venue, CI.area, CI.tel, CI.no].some(i => String(c.v[i]).includes(q))))
      .sort((a, b) => String(b.v[CI.date]).localeCompare(String(a.v[CI.date])) || Number(b.no) - Number(a.no));
    $('cCount').textContent = list.length + '人' + (list.length > 200 ? '（新しい200人を表示。探すと絞れます）' : '');
    $('cList').innerHTML = '';
    list.slice(0, 200).forEach(c => {
      const v = c.v, el = document.createElement('div');
      el.className = 'card';
      el.innerHTML = '<div class="t"><b>' + esc(v[CI.customer]) + '</b><span class="chip" style="background:' + (ST_COLOR[v[CI.status]] || '#8a93a3') + ';color:#fff">' + esc(v[CI.status] || '未設定') + '</span></div>' +
        '<div class="meta">' + esc((v[CI.date] ? dayText(v[CI.date]) + ' ' : '') + v[CI.venue] + (v[CI.area] ? ' ／ ' + v[CI.area] : '')) + '</div>' +
        '<div class="meta">AP ' + esc(v[CI.ap] || '-') + ' ／ CL ' + esc(v[CI.cl] || '-') + (v[CI.next] ? ' ／ 次回 ' + esc(dayText(v[CI.next])) : '') + '</div>';
      el.onclick = () => openCust(c);
      $('cList').appendChild(el);
    });
  }
  function openCust(c) {
    editing = { kind: 'cust', c: c };
    $('eTitle').textContent = c.v[CI.customer];
    $('eSub').textContent = '管理No ' + c.no + '（催事顧客管理）';
    $('eForm').innerHTML = D.head.map((h, j) => {
      const col = j + 2, t = D.edit[col], val = c.v[j] == null ? '' : String(c.v[j]);
      if (!t || c.fx.includes(col)) return '<label>' + esc(h) + '</label><div class="ro">' + esc(val || '-') + '</div>';
      let f;
      if (t === 'status') f = '<select data-c="' + col + '"><option value=""></option>' + D.statuses.map(s => '<option' + (s === val ? ' selected' : '') + '>' + esc(s) + '</option>').join('') + '</select>';
      else if (t === 'date') f = '<input type="date" data-c="' + col + '" value="' + esc(/^\d{4}-\d\d-\d\d$/.test(val) ? val : '') + '">';
      else if (col === 23) f = '<textarea rows="3" data-c="' + col + '">' + esc(val) + '</textarea>';
      else f = '<input data-c="' + col + '"' + (t === 'number' ? ' inputmode="numeric"' : t === 'tel' ? ' type="tel"' : '') +
        (t === 'name' ? ' list="dlNames"' : col === 4 ? ' list="dlVenues"' : col === 19 ? ' list="dlProducts"' : '') + ' value="' + esc(val) + '">';
      return '<label>' + esc(h) + '</label>' + f;
    }).join('');
    $('edit').classList.add('open');
  }

  // ===== 保存 =====
  function save() {
    const ins = [...$('eForm').querySelectorAll('[data-c]')];
    const done = r => { $('edit').classList.remove('open'); got(r); $('msg').textContent = '保存しました'; };
    const fail = e => { setBusy(false); alert(e.message); };
    if (editing.kind === 'nippo') {
      const vals = {};
      ins.forEach(i => vals[i.dataset.c] = i.value);
      setBusy(true, '保存中…');
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).saijiSaveNippo(editing.r.date, editing.r.venue, vals);
    } else {
      const c = editing.c, ch = {};
      ins.forEach(i => { const j = i.dataset.c - 2, old = c.v[j] == null ? '' : String(c.v[j]); if (i.value.trim() !== old.trim()) ch[i.dataset.c] = i.value; });
      if (!Object.keys(ch).length) { $('edit').classList.remove('open'); return; }
      setBusy(true, '保存中…');
      google.script.run.withSuccessHandler(done).withFailureHandler(fail).saijiSaveCust(c.no, c.v[CI.customer], ch);
    }
  }

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { view = b.dataset.v; store('saijiView', view); render(); });
  $('nMonth').onchange = () => { nMonthSel = $('nMonth').value; renderNippo(); };
  $('nVenue').onchange = renderNippo;
  ['cStatus', 'cWho'].forEach(id => $(id).onchange = renderCust);
  $('cq').oninput = renderCust;
  $('eCancel').onclick = () => $('edit').classList.remove('open');
  $('eSave').onclick = save;
  view = store('saijiView') === 'cust' ? 'cust' : 'nippo';
  load();
</script>
</body>
</html>
